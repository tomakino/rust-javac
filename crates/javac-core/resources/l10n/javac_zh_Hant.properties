javac.msg.bug=編譯器發生異常 ({0})。請先檢查 Bug 資料庫 (https://bugs.java.com) 中是否有重複項目，然後透過 Java Bug 回報頁面 (https://bugreport.java.com) 向 Java 編譯器回報 Bug。回報時請包含您的程式、下列診斷資訊，以及傳遞給 Java 編譯器的參數。謝謝。

