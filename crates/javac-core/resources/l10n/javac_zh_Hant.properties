## standard options

javac.opt.g=產生所有除錯資訊
javac.opt.g.none=不產生除錯資訊
javac.opt.g.lines.vars.source=只產生部分除錯資訊
javac.opt.nowarn=不產生警告
javac.opt.verbose=輸出編譯器正在執行之作業的訊息
javac.opt.deprecation=輸出使用已過時 API 的原始碼位置
javac.opt.classpath=指定尋找使用者類別檔與註解處理器的位置
javac.opt.modulepath=指定尋找應用程式模組的位置
javac.opt.sourcepath=指定尋找輸入原始碼檔的位置
javac.opt.m=僅編譯指定的模組，並檢查時間戳記
javac.opt.modulesourcepath=指定尋找多個模組之輸入原始碼檔的位置
javac.opt.bootclasspath=置換啟動類別檔的位置
javac.opt.system=置換系統模組的位置
javac.opt.upgrademodulepath=置換可升級模組的位置
javac.opt.endorseddirs=置換背書標準路徑的位置
javac.opt.extdirs=置換已安裝擴充的位置
javac.opt.processorpath=指定尋找註解處理器的位置
javac.opt.processormodulepath=指定尋找註解處理器的模組路徑
javac.opt.processor=要執行之註解處理器的名稱；略過預設探索程序
javac.opt.parameters=產生用於方法參數反射的詮釋資料
javac.opt.proc.none.only=控制是否執行註解處理及/或編譯。
javac.opt.d=指定放置所產生類別檔的位置
javac.opt.sourceDest=指定放置所產生原始碼檔的位置
javac.opt.headerDest=指定放置所產生原生標頭檔的位置
javac.opt.J=將 <flag> 直接傳遞至執行時期系統
javac.opt.encoding=指定原始碼檔所使用的字元編碼
javac.opt.profile=檢查所使用的 API 在指定設定檔中是否可用
javac.opt.target=產生適用於指定 Java SE 版本的類別檔。支援的版本: {0}
javac.opt.release=編譯為指定的 Java SE 版本。支援的版本: {0}
javac.opt.source=提供與指定 Java SE 版本的原始碼相容性。支援的版本: {0}
javac.opt.Werror=發生警告時終止編譯
javac.opt.A=傳遞至註解處理器的選項
javac.opt.implicit=指定是否為隱含參照的檔案產生類別檔
javac.opt.pkginfo=指定 package-info 檔的處理方式
javac.opt.multi-release=指定多版本 jar 中要使用的版本
javac.opt.arg.class=<class>
javac.opt.arg.class.list=<class1>[,<class2>,<class3>...]
javac.opt.arg.flag=<flag>
javac.opt.arg.key.equals.value=key[=value]
javac.opt.arg.path=<path>
javac.opt.arg.mspath=<module-source-path>
javac.opt.arg.m=<module>(,<module>)*
javac.opt.arg.jdk=<jdk>|none
javac.opt.arg.dirs=<dirs>
javac.opt.arg.directory=<directory>
javac.opt.arg.encoding=<encoding>
javac.opt.arg.profile=<profile>
javac.opt.arg.release=<release>
javac.opt.arg.number=<number>
javac.opt.plugin=要執行之外掛程式的名稱與選擇性引數
javac.opt.arg.plugin="name args"
javac.opt.arg.multi-release=<release>
javac.opt.arg.default.module.for.created.files=<module-name>

## extended options

javac.opt.maxerrs=設定要列印的錯誤數上限
javac.opt.maxwarns=設定要列印的警告數上限
javac.opt.nogj=不接受語言中的泛型
javac.opt.moreinfo=列印類型變數的延伸資訊
javac.opt.printsearch=列印搜尋類別檔位置的資訊
javac.opt.prompt=每個錯誤後停止
javac.opt.s=產生 java 原始碼而非類別檔
javac.opt.version=版本資訊
javac.opt.arg.pathname=<pathname>
javac.opt.arg.file=<filename>
javac.opt.Xbootclasspath.p=附加至啟動類別路徑開頭
javac.opt.Xbootclasspath.a=附加至啟動類別路徑結尾
javac.opt.Xlint=啟用建議的警告
javac.opt.Xlint.all=啟用所有警告
javac.opt.Xlint.none=停用所有警告
#L10N: do not localize: -Xlint
javac.opt.arg.Xlint=<key>(,<key>)*
javac.opt.Xlint.custom=要啟用或停用的警告，以逗號分隔。\n在索引鍵前加上 '-' 可停用指定的警告。\n使用 --help-lint 檢視支援的索引鍵。
javac.opt.Xlint.desc.auxiliaryclass=對原始碼檔中隱藏且由其他檔案使用的輔助類別發出警告。

javac.opt.Xlint.desc.cast=對使用不必要的強制轉型發出警告。

javac.opt.Xlint.desc.classfile=對與類別檔內容相關的問題發出警告。

javac.opt.Xlint.desc.missing-explicit-ctor=對匯出套件中公用與受保護類別缺少明確建構子的問題發出警告。

javac.opt.Xlint.desc.deprecation=對使用已過時項目的問題發出警告。

javac.opt.Xlint.desc.dep-ann=對在 JavaDoc 中標記為已過時但未使用 @Deprecated 註解的項目發出警告。

javac.opt.Xlint.desc.divzero=對常數整數 0 除法的問題發出警告。

javac.opt.Xlint.desc.empty=對 if 之後的空陳述式發出警告。

javac.opt.Xlint.desc.exports=對模組匯出相關的問題發出警告。

javac.opt.Xlint.desc.fallthrough=對從 switch 陳述式的一個 case 落入下一個 case 的問題發出警告。

javac.opt.Xlint.desc.finally=對未正常終止的 finally 子句發出警告。

javac.opt.Xlint.desc.module=對與模組系統相關的問題發出警告。

javac.opt.Xlint.desc.opens=對模組開啟相關的問題發出警告。

javac.opt.Xlint.desc.options=對與使用命令列選項相關的問題發出警告。

javac.opt.Xlint.desc.overloads=對與方法多載相關的問題發出警告。

javac.opt.Xlint.desc.overrides=對與方法覆寫相關的問題發出警告。

javac.opt.Xlint.desc.path=對命令列上無效的路徑元素發出警告。

javac.opt.Xlint.desc.processing=對與註解處理相關的問題發出警告。

javac.opt.Xlint.desc.rawtypes=對使用原始類型的問題發出警告。

javac.opt.Xlint.desc.removal=對使用已標記為移除的 API 發出警告。

javac.opt.Xlint.desc.requires-automatic=對 requires 子句中使用自動模組的問題發出警告。

javac.opt.Xlint.desc.requires-transitive-automatic=對 requires transitive 中的自動模組發出警告。

javac.opt.Xlint.desc.serial=對未提供序列版本 ID 的 Serializable 類別發出警告。\n                        也對可序列化元素存取非公用成員的問題發出警告。

javac.opt.Xlint.desc.static=對使用實體存取靜態成員的問題發出警告。

javac.opt.Xlint.desc.strictfp=對不必要地使用 strictfp 修飾詞發出警告。

javac.opt.Xlint.desc.text-blocks=對文字區塊縮排中不一致的空白字元發出警告。

javac.opt.Xlint.desc.try=對與使用 try 區塊（即 try-with-resources）相關的問題發出警告。

javac.opt.Xlint.desc.unchecked=對未檢查的作業發出警告。

javac.opt.Xlint.desc.varargs=對可能不安全的可變引數方法發出警告。

javac.opt.Xlint.desc.preview=對使用預覽語言功能的問題發出警告。

javac.opt.Xlint.desc.synchronization=對在以值為基礎的類別實體上進行同步的問題發出警告。

javac.opt.Xdoclint=啟用對 javadoc 註解中問題的建議檢查
# L10N: do not localize: all none
javac.opt.Xdoclint.subopts=(all|none|[-]<group>)[/<access>]

# L10N: do not localize: accessibility html missing reference syntax
# L10N: do not localize: public protected package private
javac.opt.Xdoclint.custom=啟用或停用對 javadoc 註解中問題的特定檢查，\n其中 <group> 是 accessibility、html、missing、reference 或 syntax 之一，\n而 <access> 是 public、protected、package 或 private 之一。

javac.opt.Xdoclint.package.args=[-]<packages>(,[-]<package>)*

javac.opt.Xdoclint.package.desc=啟用或停用特定套件中的檢查。每個 <package> 是套件的\n完整名稱，或是以 '.*' 結尾的套件名稱前置字串，其會\n展開為指定套件的所有子套件。每個 <package> 都可以在前面\n加上 '-'，以停用指定套件的檢查。

javac.opt.Xstdout=重新導向標準輸出
javac.opt.X=列印額外選項的說明
javac.opt.help=列印此說明訊息
javac.opt.help.lint=列印 -Xlint 支援的索引鍵
javac.opt.help.lint.header=-Xlint 支援的索引鍵如下:
javac.opt.print=列印指定類型的文字表示
javac.opt.printRounds=列印註解處理循環的相關資訊
javac.opt.printProcessorInfo=列印處理器被要求處理哪些註解的相關資訊
javac.opt.userpathsfirst=先在類別路徑與來源路徑中搜尋類別，再搜尋啟動類別路徑（而非相反）
javac.opt.prefer=指定當隱含編譯的類別同時找到原始碼檔與類別檔時要讀取的檔案
javac.opt.preview=啟用預覽語言功能。需與 -source 或 --release 一起使用。
javac.opt.AT=從檔案讀取選項與檔名
javac.opt.diags=選取診斷模式
javac.opt.addExports=指定要視為從其定義模組匯出至其他模組的套件，\n若 <other-module> 為 ALL-UNNAMED，則匯出至所有未命名模組。
javac.opt.arg.addExports=<module>/<package>=<other-module>(,<other-module>)*
javac.opt.addReads=指定要視為指定模組所需的其他模組。\n<other-module> 可為 ALL-UNNAMED，以要求未命名模組。
javac.opt.arg.addReads=<module>=<other-module>(,<other-module>)*
javac.opt.patch=以 JAR 檔或目錄中的類別與資源\n置換或擴充模組
javac.opt.arg.patch=<module>=<file>(:<file>)*
javac.opt.addmods=除初始模組外要解析的根模組，或若 <module> 為 ALL-MODULE-PATH，\n則為模組路徑上的所有模組。
javac.opt.arg.addmods=<module>(,<module>)*
javac.opt.limitmods=限制可觀察模組的範圍
javac.opt.arg.limitmods=<module>(,<module>)*
javac.opt.module.version=指定正在編譯之模組的版本
javac.opt.arg.module.version=<version>
javac.opt.inherit_runtime_environment=從執行時期環境繼承模組系統配置選項。
javac.opt.default.module.for.created.files=註解處理器所建立檔案的備援目標模組（若未指定或推斷）。

