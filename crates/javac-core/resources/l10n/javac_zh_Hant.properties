## standard options

javac.opt.g=生成所有調試信息
javac.opt.g.none=不生成任何調試信息
javac.opt.g.lines.vars.source=只生成某些調試信息
javac.opt.nowarn=不生成任何警告
javac.opt.verbose=輸出有關編譯器正在執行的操作的消息
javac.opt.deprecation=輸出使用已過時的 API 的源位置
javac.opt.classpath=指定查找用戶類文件和注釋處理程序的位置
javac.opt.modulepath=指定查找應用程式模塊的位置
javac.opt.sourcepath=指定查找輸入源文件的位置
javac.opt.m=只編譯指定的模塊，請檢查時間戳
javac.opt.modulesourcepath=指定查找多個模塊的輸入源文件的位置
javac.opt.bootclasspath=覆蓋引導類文件的位置
javac.opt.system=覆蓋系統模塊位置
javac.opt.upgrademodulepath=覆蓋可升級模塊位置
javac.opt.endorseddirs=覆蓋籤名的標準路徑的位置
javac.opt.extdirs=覆蓋所安裝擴展的位置
javac.opt.processorpath=指定查找注釋處理程序的位置
javac.opt.processormodulepath=指定查找注釋處理程序的模塊路徑
javac.opt.processor=要運行的注釋處理程序的名稱; 繞過默認的搜索進程
javac.opt.parameters=生成元數據以用於方法參數的反射
javac.opt.proc.none.only=控制是否執行注釋處理和/或編譯。
javac.opt.d=指定放置生成的類文件的位置
javac.opt.sourceDest=指定放置生成的源文件的位置
javac.opt.headerDest=指定放置生成的本機標頭文件的位置
javac.opt.J=直接將 <標記> 傳遞給運行時系統
javac.opt.encoding=指定源文件使用的字符編碼
javac.opt.profile=請確保使用的 API 在指定的配置文件中可用
javac.opt.target=生成適合指定的 Java SE 發行版的類文件。支持的發行版：{0}
javac.opt.release=為指定的 Java SE 發行版編譯。支持的發行版：{0}
javac.opt.source=提供與指定的 Java SE 發行版的源兼容性。支持的發行版：{0}
javac.opt.Werror=出現警告時終止編譯
javac.opt.A=傳遞給注釋處理程序的選項
javac.opt.implicit=指定是否為隱式引用文件生成類文件
javac.opt.pkginfo=指定 package-info 文件的處理
javac.opt.multi-release=指定在多發行版 jar 中使用哪個發行版
javac.opt.arg.class=<class>
javac.opt.arg.class.list=<class1>[,<class2>,<class3>...]
javac.opt.arg.flag=<flag>
javac.opt.arg.key.equals.value=key[=value]
javac.opt.arg.path=<path>
javac.opt.arg.mspath=<module-source-path>
javac.opt.arg.m=<模塊>(,<模塊>)*
javac.opt.arg.jdk=<jdk>|none
javac.opt.arg.dirs=<dirs>
javac.opt.arg.directory=<directory>
javac.opt.arg.encoding=<encoding>
javac.opt.arg.profile=<profile>
javac.opt.arg.release=<release>
javac.opt.arg.release=<release>
javac.opt.arg.number=<number>
javac.opt.plugin=要運行的插件的名稱和可選參數
javac.opt.arg.plugin="名稱參數"
javac.opt.arg.multi-release=<release>
javac.opt.arg.default.module.for.created.files=<module-name>

## extended options

javac.opt.maxerrs=設置要輸出的錯誤的最大數目
javac.opt.maxwarns=設置要輸出的警告的最大數目
javac.opt.nogj=語言中不接受泛型
javac.opt.moreinfo=輸出類型變量的擴展信息
javac.opt.printsearch=輸出有關搜索類文件的位置的信息
javac.opt.prompt=在每次出錯後停止
javac.opt.s=發出 java 源而不是類文件
javac.opt.version=版本信息
javac.opt.arg.pathname=<pathname>
javac.opt.arg.file=<filename>
javac.opt.Xbootclasspath.p=置於引導類路徑之前
javac.opt.Xbootclasspath.a=置於引導類路徑之後
javac.opt.Xlint=啟用建議的警告
javac.opt.Xlint.all=啟用所有警告
javac.opt.Xlint.none=禁用所有警告
#L10N: do not localize: -Xlint
javac.opt.arg.Xlint=<密鑰>(,<密鑰>)*
javac.opt.Xlint.custom=要啟用或禁用的警告, 使用逗號分隔。\n        在關鍵字前面加上 '-' 可禁用指定的警告。\n        支持的關鍵字包括:
javac.opt.Xlint.desc.auxiliaryclass=有關輔助類在源文件中隱藏, 但在其他文件中使用的警告。

javac.opt.Xlint.desc.cast=有關使用了不必要轉換的警告。

javac.opt.Xlint.desc.classfile=有關與類文件內容相關的問題的警告。

javac.opt.Xlint.desc.missing-explicit-ctor=有關導出的程序包中的公共和受保護類中缺少顯式構造器的警告。

javac.opt.Xlint.desc.deprecation=有關使用了已過時項的警告。

javac.opt.Xlint.desc.dep-ann=有關項在 JavaDoc 中標記為已過時但未使用 @Deprecated 注釋的警告。

javac.opt.Xlint.desc.divzero=有關除以常量整數 0 的警告。

javac.opt.Xlint.desc.empty=有關 if 之後沒有語句的警告。

javac.opt.Xlint.desc.exports=有關與模塊導出相關的問題的警告。

javac.opt.Xlint.desc.fallthrough=有關從 switch 語句的一個 case 向下順序執行到下一個 case 的警告。

javac.opt.Xlint.desc.finally=有關 finally 子句未正常終止的警告。

javac.opt.Xlint.desc.module=有關模塊系統相關問題的警告。

javac.opt.Xlint.desc.opens=有關與模塊打開相關的問題的警告。

javac.opt.Xlint.desc.options=有關與使用命令行選項相關的問題的警告。

javac.opt.Xlint.desc.overloads=有關與方法重載相關的問題的警告。

javac.opt.Xlint.desc.overrides=有關與方法覆蓋相關的問題的警告。

javac.opt.Xlint.desc.path=有關命令行上的路徑元素無效的警告。

javac.opt.Xlint.desc.processing=有關與注釋處理相關的問題的警告。

javac.opt.Xlint.desc.rawtypes=有關使用了原始類型的警告。

javac.opt.Xlint.desc.removal=有關使用了標記為待刪除的 API 的警告。

javac.opt.Xlint.desc.requires-automatic=有關在 requires 子句中使用自動模塊的警告。

javac.opt.Xlint.desc.requires-transitive-automatic=有關 requires 過渡中的自動模塊的警告。

javac.opt.Xlint.desc.serial=有關未提供序列版本 ID 的可序列化類的警告。\n                             此外還警告有關可串行化元素對非公共成員的訪問。

javac.opt.Xlint.desc.static=有關使用實例來訪問靜態成員的警告。

javac.opt.Xlint.desc.text-blocks=有關文本塊縮進中的空格字符不一致的警告。

javac.opt.Xlint.desc.try=有關與使用 try 塊 (例如 try-with-resources) 相關的問題的警告。

javac.opt.Xlint.desc.unchecked=有關未檢查操作的警告。

javac.opt.Xlint.desc.varargs=有關潛在不安全的 vararg 方法的警告。

javac.opt.Xlint.desc.preview=有關使用預覽語言功能的警告。

javac.opt.Xlint.desc.synchronization=有關嘗試在基於值的類的實例上同步的警告。

javac.opt.Xdoclint=為 javadoc 注釋中的問題啟用建議的檢查
# L10N: do not localize: all none
javac.opt.Xdoclint.subopts = (all|none|[-]<group>)[/<access>]

# L10N: do not localize: accessibility html missing reference syntax
# L10N: do not localize: public protected package private
javac.opt.Xdoclint.custom=為 javadoc 注釋中的問題啟用或禁用特定檢查,\n        其中 <group> 為 accessibility, html, missing, reference 或 syntax 之一。\n        <access> 為 public, protected, package 或 private 之一。

javac.opt.Xdoclint.package.args = [-]<程序包>(,[-]<程序包>)*

javac.opt.Xdoclint.package.desc=在特定的程序包中啟用或禁用檢查。每個 <程序包> 是\n程序包的限定名稱, 或程序包名稱前綴後跟 '.*', \n它擴展到給定程序包的所有子程序包。在每個 <程序包>\n前面加上 '-' 可以為指定程序包禁用檢查。

javac.opt.doclint.format=指定文檔注釋的格式

javac.opt.Xstdout=重定向標準輸出
javac.opt.X=輸出額外選項的幫助
javac.opt.help=輸出此幫助消息
javac.opt.print=輸出指定類型的文本表示
javac.opt.printRounds=輸出有關注釋處理循環的信息
javac.opt.printProcessorInfo=輸出有關請求處理程序處理哪些注釋的信息
javac.opt.userpathsfirst=在引導類路徑之前而不是之後搜索類的類路徑和源路徑
javac.opt.prefer=指定讀取文件, 當同時找到隱式編譯類的源文件和類文件時
javac.opt.preview=啟用預覽語言功能。要與 -source 或 --release 一起使用。
javac.opt.AT=從文件讀取選項和文件名
javac.opt.diags=選擇診斷模式
javac.opt.addExports=指定被視為已從其定義模塊導出到其他模塊或者導出到所有\n        未命名模塊 (如果 <other-module> 為 ALL-UNNAMED) 的程序包。
javac.opt.arg.addExports=<模塊>/<程序包>=<其他模塊>(,<其他模塊>)*
javac.opt.addReads=指定被視為給定模塊需要的其他模塊。\n<other-module> 可能需要為 ALL-UNNAMED, 以便要求未命名模塊。
javac.opt.arg.addReads=<模塊>=<其他模塊>(,<其他模塊>)*
javac.opt.patch=使用 JAR 文件或目錄中的類和資源覆蓋\n        或增強模塊
javac.opt.arg.patch=<模塊>=<文件>(:<文件>)*
javac.opt.addmods=除了初始模塊之外要解析的根模塊; 如果 <module>\n        為 ALL-MODULE-PATH, 則為模塊路徑中的所有模塊。
javac.opt.arg.addmods=<模塊>(,<模塊>)*
javac.opt.limitmods=限制可觀察模塊的領域
javac.opt.arg.limitmods=<模塊>(,<模塊>)*
javac.opt.module.version=指定正在編譯的模塊版本
javac.opt.arg.module.version=<版本>
javac.opt.inherit_runtime_environment=從運行時環境繼承模塊系統配置選項。
javac.opt.default.module.for.created.files=由注釋處理程序創建的文件的備用目標模塊 (如果未指定或推斷任何模塊)。

## messages

javac.msg.usage.header=用法: {0} <options> <source files>\n其中, 可能的選項包括:

javac.msg.usage=用法: {0} <選項> <源文件>\n使用 --help 可列出可能的選項

javac.msg.usage.nonstandard.footer=這些額外選項如有更改, 恕不另行通知。

javac.msg.bug=編譯器 ({0}) 中出現異常錯誤。如果在 Bug Database (https://bugs.java.com) 中沒有找到該錯誤，請通過 Java Bug 報告頁 (https://bugreport.java.com) 建立該 Java 編譯器 Bug。請在報告中附上您的程序、以下診斷信息以及傳遞到 Java 編譯器的參數。謝謝。

javac.msg.io=\n\n發生輸入/輸出錯誤。\n有關詳細信息, 請參閱以下堆棧跟蹤。\n

javac.msg.proc.annotation.uncaught.exception=\n\n注釋處理程序拋出未捕獲的異常錯誤。\n有關詳細信息, 請參閱以下堆棧跟蹤。\n

javac.msg.plugin.uncaught.exception=\n\n插件拋出未捕獲的異常錯誤。\n有關詳細信息, 請參閱以下堆棧跟蹤。\n

javac.msg.resource=\n\n系統資源不足。\n有關詳細信息, 請參閱以下堆棧跟蹤。\n

javac.version={0} {1}
javac.fullVersion={0}完整版本 "{1}"

