## 標準選項

javac.opt.g=\
    產生所有除錯資訊
javac.opt.g.none=\
    不產生除錯資訊
javac.opt.g.lines.vars.source=\
    僅產生部分除錯資訊
javac.opt.nowarn=\
    不產生警告
javac.opt.verbose=\
    輸出編譯器正在執行之作業的相關訊息
javac.opt.deprecation=\
    輸出使用已過時 API 的原始碼位置
javac.opt.classpath=\
    指定尋找使用者類別檔案和註釋處理器的位置
javac.opt.modulepath=\
    指定尋找應用程式模組的位置
javac.opt.sourcepath=\
    指定尋找輸入原始碼檔案的位置
javac.opt.m=\
    僅編譯指定的模組，並檢查時間戳記
javac.opt.modulesourcepath=\
    指定尋找多個模組之輸入原始碼檔案的位置
javac.opt.bootclasspath=\
    置換啟動類別檔案的位置
javac.opt.system=\
    置換系統模組的位置
javac.opt.upgrademodulepath=\
    置換可升級模組的位置
javac.opt.endorseddirs=\
    置換背書標準路徑的位置
javac.opt.extdirs=\
    置換已安裝擴充功能的位置
javac.opt.processorpath=\
    指定尋找註釋處理器的位置
javac.opt.processormodulepath=\
    指定尋找註釋處理器的模組路徑
javac.opt.processor=\
    要執行之註釋處理器的名稱；略過預設探索程序
javac.opt.parameters=\
    產生方法參數反射用的中繼資料
javac.opt.proc.none.only=\
    控制是否執行註釋處理及/或編譯。
javac.opt.d=\
    指定放置產生之類別檔案的位置
javac.opt.sourceDest=\
    指定放置產生之原始碼檔案的位置
javac.opt.headerDest=\
    指定放置產生之原生標頭檔案的位置
javac.opt.J=\
    將 <flag> 直接傳遞至執行階段系統
javac.opt.encoding=\
    指定原始碼檔案所使用的字元編碼
javac.opt.profile=\
    檢查使用的 API 是否可在指定的設定檔中使用
javac.opt.target=\
    產生適用於指定 Java SE 版本的類別檔案。支援的版本：{0}
javac.opt.release=\
    針對指定的 Java SE 版本進行編譯。支援的版本：{0}
javac.opt.source=\
    提供與指定 Java SE 版本相容的原始碼。支援的版本：{0}
javac.opt.Werror=\
    發生警告時終止編譯
javac.opt.A=\
    傳遞至註釋處理器的選項
javac.opt.implicit=\
    指定是否為隱含參照的檔案產生類別檔案
javac.opt.pkginfo=\
    指定 package-info 檔案的處理方式
javac.opt.multi-release=\
    指定要在多版本 jar 中使用哪個版本
javac.opt.arg.class=\
    <class>
javac.opt.arg.class.list=\
    <class1>[,<class2>,<class3>...]
javac.opt.arg.flag=\
    <flag>
javac.opt.arg.key.equals.value=\
    key[=value]
javac.opt.arg.path=\
    <path>
javac.opt.arg.mspath=\
    <module-source-path>
javac.opt.arg.m=\
    <module>(,<module>)*
javac.opt.arg.jdk=\
    <jdk>|none
javac.opt.arg.dirs=\
    <dirs>
javac.opt.arg.directory=\
    <directory>
javac.opt.arg.encoding=\
    <encoding>
javac.opt.arg.profile=\
    <profile>
javac.opt.arg.release=\
    <release>
javac.opt.arg.number=\
    <number>
javac.opt.plugin=\
    要執行之外掛程式的名稱及選擇性引數
javac.opt.arg.plugin=\
    "name args"
javac.opt.arg.multi-release=\
    <release>
javac.opt.arg.default.module.for.created.files=\
    <module-name>

## 延伸選項

javac.opt.maxerrs=\
    設定要列印的錯誤數上限
javac.opt.maxwarns=\
    設定要列印的警告數上限
javac.opt.nogj=\
    不接受語言中的泛型
javac.opt.moreinfo=\
    列印類型變數的延伸資訊
javac.opt.printsearch=\
    列印搜尋類別檔案的位置資訊
javac.opt.prompt=\
    在每個錯誤之後停止
javac.opt.s=\
    輸出 java 原始碼而非類別檔案
javac.opt.version=\
    版本資訊
javac.opt.arg.pathname=\
    <pathname>
javac.opt.arg.file=\
    <filename>
javac.opt.Xbootclasspath.p=\
    前置於啟動類別路徑
javac.opt.Xbootclasspath.a=\
    附加至啟動類別路徑
javac.opt.Xlint=\
    啟用建議的警告
javac.opt.Xlint.all=\
    啟用所有警告
javac.opt.Xlint.none=\
    停用所有警告
#L10N: do not localize: -Xlint
javac.opt.arg.Xlint=\
    <key>(,<key>)*
javac.opt.Xlint.custom=\
    要啟用或停用的警告，以逗號分隔。\n\
    在索引鍵前面加上 '-' 可停用指定的警告。\n\
    使用 --help-lint 可查看支援的索引鍵。
javac.opt.Xlint.desc.auxiliaryclass=\
    對隱藏在原始碼檔案中且從其他檔案使用的輔助類別發出警告。

javac.opt.Xlint.desc.cast=\
    對使用不必要的強制轉換發出警告。

javac.opt.Xlint.desc.classfile=\
    對類別檔案內容的相關問題發出警告。

javac.opt.Xlint.desc.missing-explicit-ctor=\
    對匯出套件中公用和受保護類別缺少明確建構函式發出警告。

javac.opt.Xlint.desc.deprecation=\
    對使用已過時項目發出警告。

javac.opt.Xlint.desc.dep-ann=\
    對在 JavaDoc 中標記為已過時但未使用 @Deprecated 註釋的項目發出警告。

javac.opt.Xlint.desc.divzero=\
    對除以常數整數 0 發出警告。

javac.opt.Xlint.desc.empty=\
    對 if 之後的空陳述式發出警告。

javac.opt.Xlint.desc.exports=\
    對模組匯出的相關問題發出警告。

javac.opt.Xlint.desc.fallthrough=\
    對從 switch 述詞的一個 case 落入下一個 case 發出警告。

javac.opt.Xlint.desc.finally=\
    對未正常終止的 finally 子句發出警告。

javac.opt.Xlint.desc.module=\
    對模組系統的相關問題發出警告。

javac.opt.Xlint.desc.opens=\
    對模組開啟的相關問題發出警告。

javac.opt.Xlint.desc.options=\
    對命令列選項使用的相關問題發出警告。

javac.opt.Xlint.desc.overloads=\
    對方法多載的相關問題發出警告。

javac.opt.Xlint.desc.overrides=\
    對方法覆寫的相關問題發出警告。

javac.opt.Xlint.desc.path=\
    對命令列上無效的路徑元素發出警告。

javac.opt.Xlint.desc.processing=\
    對註釋處理的相關問題發出警告。

javac.opt.Xlint.desc.rawtypes=\
    對使用原始類型發出警告。

javac.opt.Xlint.desc.removal=\
    對使用已標記為移除的 API 發出警告。

javac.opt.Xlint.desc.requires-automatic=\
    對在 requires 子句中使用自動模組發出警告。

javac.opt.Xlint.desc.requires-transitive-automatic=\
    對 requires transitive 中的自動模組發出警告。

javac.opt.Xlint.desc.serial=\
    對未提供序列版本 ID 的 Serializable 類別發出警告。\n\
\                        同時對從可序列化元素存取非公用成員發出警告。

javac.opt.Xlint.desc.static=\
    對使用實例存取靜態成員發出警告。

javac.opt.Xlint.desc.strictfp=\
    對不必要地使用 strictfp 修飾符發出警告。

javac.opt.Xlint.desc.text-blocks=\
    對文字區塊縮排中不一致的空白字元發出警告。

javac.opt.Xlint.desc.try=\
    對 try 區塊使用的相關問題 (即 try-with-resources) 發出警告。

javac.opt.Xlint.desc.unchecked=\
    對未檢查的作業發出警告。

javac.opt.Xlint.desc.varargs=\
    對可能不安全的多重引數方法發出警告。

javac.opt.Xlint.desc.preview=\
    對使用預覽語言功能發出警告。

javac.opt.Xlint.desc.synchronization=\
    對嘗試在以值為基礎的類別實例上進行同步發出警告。

javac.opt.Xdoclint=\
    啟用對 javadoc 註解中問題的建議檢查
# L10N: do not localize: all none
javac.opt.Xdoclint.subopts = \
    (all|none|[-]<group>)[/<access>]

# L10N: do not localize: accessibility html missing reference syntax
# L10N: do not localize: public protected package private
javac.opt.Xdoclint.custom=\
    啟用或停用對 javadoc 註解中問題的特定檢查，\n\
    其中 <group> 是 accessibility、html、missing、reference 或 syntax 之一，\n\
    而 <access> 是 public、protected、package 或 private 之一。

javac.opt.Xdoclint.package.args = \
    [-]<packages>(,[-]<package>)*

javac.opt.Xdoclint.package.desc=\
    啟用或停用特定套件中的檢查。每個 <package> 是套件的\n\
    完整名稱，或是後面接著 '.*' 的套件名稱前置碼，其會\n\
    展開為指定套件的所有子套件。每個 <package> 前面可以加上\n\
    '-'，以停用指定套件或套件的檢查。

javac.opt.Xstdout=\
    重新導向標準輸出
javac.opt.X=\
    列印額外選項的說明
javac.opt.help=\
    列印此說明訊息
javac.opt.help.lint=\
    列印 -Xlint 支援的索引鍵
javac.opt.help.lint.header=\
    -Xlint 支援的索引鍵如下：
javac.opt.print=\
    列印指定類型的文字表示
javac.opt.printRounds=\
    列印註釋處理各回合的相關資訊
javac.opt.printProcessorInfo=\
    列印處理器被要求處理哪些註釋的相關資訊
javac.opt.userpathsfirst=\
    在啟動類別路徑之前 (而非之後) 搜尋類別路徑和原始碼路徑中的類別
javac.opt.prefer=\
    指定當同時找到隱含編譯類別的原始碼檔案和類別檔案時要讀取的檔案
javac.opt.preview=\
    啟用預覽語言功能。需與 -source 或 --release 搭配使用。
javac.opt.AT=\
    從檔案讀取選項和檔名
javac.opt.diags=\
    選取診斷模式
javac.opt.addExports=\
    指定要視為從其定義模組匯出至其他模組的套件，\n\
    若 <other-module> 為 ALL-UNNAMED，則匯出至所有未具名模組。
javac.opt.arg.addExports=\
    <module>/<package>=<other-module>(,<other-module>)*
javac.opt.addReads=\
    指定要視為指定模組所需的其他模組。\n\
    <other-module> 可以是 ALL-UNNAMED，以要求未具名模組。
javac.opt.arg.addReads=\
    <module>=<other-module>(,<other-module>)*
javac.opt.patch=\
    使用 JAR 檔案或目錄中的類別和資源\n\
    置換或擴充模組
javac.opt.arg.patch=\
    <module>=<file>(:<file>)*
javac.opt.addmods=\
    除初始模組外要解析的根模組，或者若 <module> 為 ALL-MODULE-PATH，\n\
    則為模組路徑上的所有模組。
javac.opt.arg.addmods=\
    <module>(,<module>)*
javac.opt.limitmods=\
    限制可觀察模組的範圍
javac.opt.arg.limitmods=\
    <module>(,<module>)*
javac.opt.module.version=\
    指定要編譯之模組的版本
javac.opt.arg.module.version=\
    <version>
javac.opt.inherit_runtime_environment=\
    從執行階段環境繼承模組系統配置選項。
javac.opt.default.module.for.created.files=\
    註釋處理器所建立檔案的備援目標模組 (若未指定或推斷)。

