#L10N: do not localize: -Xlint
javac.opt.arg.Xlint=<Schlüssel>(,<Schlüssel>)*
javac.opt.Xlint.custom=Aktivieren oder Deaktivieren von Warnungen, durch Komma getrennt.\n Einem Schlüssel '-' voranstellen, um die angegebene Warnung zu deaktivieren.\n Mit --help-lint die unterstützten Schlüssel anzeigen.
javac.opt.Xlint.desc.auxiliaryclass=Warnen vor einer Hilfsklasse, die in einer Quelldatei verborgen und aus anderen Dateien verwendet wird.

javac.opt.Xlint.desc.cast=Warnen vor Verwendung unnötiger Umwandlungen.

javac.opt.Xlint.desc.classfile=Warnen vor Problemen mit Klassendateiinhalten.

javac.opt.Xlint.desc.missing-explicit-ctor=Warnen vor fehlenden expliziten Konstruktoren in öffentlichen und geschützten Klassen in exportierten Paketen.

javac.opt.Xlint.desc.deprecation=Warnen vor Verwendung veralteter Elemente.

javac.opt.Xlint.desc.dep-ann=Warnen vor Elementen, die im JavaDoc als veraltet markiert, aber nicht mit der @Deprecated-Annotation versehen sind.

javac.opt.Xlint.desc.divzero=Warnen vor Division durch die Konstante Ganzzahl 0.

javac.opt.Xlint.desc.empty=Warnen vor leerer Anweisung nach if.

javac.opt.Xlint.desc.exports=Warnen vor Problemen mit Modulexporten.

javac.opt.Xlint.desc.fallthrough=Warnen vor Fallthrough von einem case einer switch-Anweisung zum nächsten.

javac.opt.Xlint.desc.finally=Warnen vor finally-Klauseln, die nicht normal beendet werden.

javac.opt.Xlint.desc.module=Warnen vor Problemen mit dem Modulsystem.

javac.opt.Xlint.desc.opens=Warnen vor Problemen mit Modul-opens.

javac.opt.Xlint.desc.options=Warnen vor Problemen bei der Verwendung von Befehlszeilenoptionen.

javac.opt.Xlint.desc.overloads=Warnen vor Problemen mit Methodenüberladungen.

javac.opt.Xlint.desc.overrides=Warnen vor Problemen mit Methodenüberschreibungen.

javac.opt.Xlint.desc.path=Warnen vor ungültigen Pfadelementen in der Befehlszeile.

javac.opt.Xlint.desc.processing=Warnen vor Problemen mit der Annotationsverarbeitung.

javac.opt.Xlint.desc.rawtypes=Warnen vor Verwendung von Roh-Typen.

javac.opt.Xlint.desc.removal=Warnen vor Verwendung von APIs, die zur Entfernung markiert wurden.

javac.opt.Xlint.desc.requires-automatic=Warnen vor Verwendung automatischer Module in den requires-Klauseln.

javac.opt.Xlint.desc.requires-transitive-automatic=Warnen vor automatischen Modulen in requires transitive.

javac.opt.Xlint.desc.serial=Warnen vor serialisierbaren Klassen ohne Serial-Version-ID.\n Auch warnen vor Zugriff auf nicht öffentliche Elemente von einem serialisierbaren Element.

javac.opt.Xlint.desc.static=Warnen vor Zugriff auf ein statisches Element über eine Instanz.

javac.opt.Xlint.desc.strictfp=Warnen vor unnötiger Verwendung des strictfp-Modifikators.

javac.opt.Xlint.desc.text-blocks=Warnen vor inkonsistenten Leerraumzeichen in der Textblockeinrückung.

javac.opt.Xlint.desc.try=Warnen vor Problemen bei der Verwendung von try-Blöcken (d.h. try-with-resources).

javac.opt.Xlint.desc.unchecked=Warnen vor ungeprüften Vorgängen.

javac.opt.Xlint.desc.varargs=Warnen vor potenziell unsicheren vararg-Methoden.

javac.opt.Xlint.desc.preview=Warnen vor Verwendung von Vorschausprachfunktionen.

javac.opt.Xlint.desc.synchronization=Warnen vor Synchronisierungsversuchen auf Instanzen wertbasierter Klassen.

javac.opt.Xdoclint=Empfohlene Prüfungen auf Probleme in Javadoc-Kommentaren aktivieren
# L10N: do not localize: all none
javac.opt.Xdoclint.subopts=(all|none|[-]<Gruppe>)[/<Zugriff>]

# L10N: do not localize: accessibility html missing reference syntax
# L10N: do not localize: public protected package private
javac.opt.Xdoclint.custom=Bestimmte Prüfungen auf Probleme in Javadoc-Kommentaren aktivieren oder deaktivieren,\n wobei <Gruppe> eine von accessibility, html, missing, reference oder syntax ist\n und <Zugriff> eine von public, protected, package oder private.

javac.opt.Xdoclint.package.args=[-]<Pakete>(,[-]<Paket>)*

javac.opt.Xdoclint.package.desc=Prüfungen in bestimmten Paketen aktivieren oder deaktivieren. Jedes <Paket> ist entweder der\n qualifizierte Name eines Pakets oder ein Paketnamenpräfix gefolgt von '.*', das\n auf alle Unterpakete des angegebenen Pakets erweitert wird. Jedem <Paket> kann '-'\n vorangestellt werden, um Prüfungen für das/die angegebene(n) Paket(e) zu deaktivieren.

