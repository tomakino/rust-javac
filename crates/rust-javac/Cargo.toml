[package]
name = "rust-javac"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ravac"
path = "src/main.rs"

[lib]
name = "ravac"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
javac-core.workspace = true
javac-fs.workspace = true
javac-strings.workspace = true
mimalloc = "0.1"
