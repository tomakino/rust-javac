[workspace]
resolver = "3"
members = [
    "crates/javac-tools",
    "crates/javac-classpath",
    "crates/javac-charset",
    "crates/javac-fs",
    "crates/javac-source",
    "crates/javac-strings",
    "crates/javac-unicode",
    "crates/javac-jimage",
    "crates/javac-jmod",
    "crates/javac-zip",
    "crates/javac-ctsym",
    "crates/javac-core",
    "crates/javac-floating",
    "crates/rust-javac",
    "crates/javac-tests",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only WITH Classpath-exception-2.0"

[workspace.dependencies]
javac-ctsym = { path = "crates/javac-ctsym" }
javac-floating = { path = "crates/javac-floating" }
javac-source = { path = "crates/javac-source" }
javac-unicode = { path = "crates/javac-unicode" }
javac-strings = { path = "crates/javac-strings" }
javac-tools = { path = "crates/javac-tools" }
javac-core = { path = "crates/javac-core" }
javac-jimage = { path = "crates/javac-jimage" }
javac-jmod = { path = "crates/javac-jmod" }
javac-zip = { path = "crates/javac-zip" }
javac-classpath = { path = "crates/javac-classpath" }
javac-charset = { path = "crates/javac-charset" }
javac-fs = { path = "crates/javac-fs" }

[profile.release]
lto = "thin"
