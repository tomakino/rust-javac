[workspace]
resolver = "3"
members = [
    "crates/javac-tools",
    "crates/javac-classpath",
    "crates/javac-charset",
    "crates/javac-fs",
    "crates/javac-source",
    "crates/javac-strings",
    "crates/javac-unicode",
    "crates/javac-jimage",
    "crates/javac-jmod",
    "crates/javac-zip",
    "crates/javac-ctsym",
    "crates/javac-core",
    "crates/javac-floating",
    "crates/rust-javac",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only WITH Classpath-exception-2.0"

[workspace.dependencies]
javac-floating = { path = "crates/javac-floating" }
javac-source = { path = "crates/javac-source" }
javac-unicode = { path = "crates/javac-unicode" }
javac-strings = { path = "crates/javac-strings" }
javac-tools = { path = "crates/javac-tools" }
javac-core = { path = "crates/javac-core" }
javac-jimage = { path = "crates/javac-jimage" }
javac-jmod = { path = "crates/javac-jmod" }
javac-zip = { path = "crates/javac-zip" }
javac-classpath = { path = "crates/javac-classpath" }
javac-charset = { path = "crates/javac-charset" }
javac-fs = { path = "crates/javac-fs" }
sys-locale = "0.3"
unic-langid = "0.9"

# The compiler is a tight, allocation-heavy tree walk; at opt-level 0 the
# debug build spends more than half its time in non-inlined accessors and
# bounds checks. opt-level 1 restores register allocation and basic inlining.
#
# debug = 1 keeps line tables (so panics and backtraces still name the source
# line) but drops the type/variable information and the macro expansions. Full
# debug info was 156 MB of the 159 MB executable and dominated link time.
[profile.dev]
opt-level = 1
debug = 1

[profile.release]
lto = "fat"
codegen-units = 1
