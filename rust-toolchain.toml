[toolchain]
# Pinned nightly whose rustc accepts --jobs-frontend (the parallel front end,
# still behind -Zunstable-options). The parallel front end cuts a from-scratch
# debug build of javac-core from 66 s to 42 s on this 8-core machine.
#
# Pinned to a date on purpose: "nightly" would move under us and the -Z flag
# set has already been renamed once (-Zthreads -> --jobs-frontend).
channel = "nightly-2026-11-01"
components = ["rustfmt", "clippy"]
profile = "minimal"
